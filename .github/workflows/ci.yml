name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to keep the pipeline fast (G-8).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck · lint · format · test · build)
    # ubuntu-only on purpose: these checks are platform-agnostic (TS typecheck, lint,
    # format, unit tests with injected executors, bundling). The platform-sensitive
    # coverage lives in the `e2e` job, which runs on macOS too (TD-04) — that's where a
    # real Electron launch and the reaper's real `ps`/`kill` actually differ by OS.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        # CI bundles but never launches Electron, so skip the ~100MB binary download.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # Independent checks — run them all even if an earlier one fails, so a PR shows
      # every problem at once.
      - name: Typecheck
        if: '!cancelled()'
        run: pnpm -r typecheck

      - name: Lint (incl. no-electron-in-core boundary rule)
        if: '!cancelled()'
        run: pnpm lint

      - name: Format check
        if: '!cancelled()'
        run: pnpm format:check

      - name: Test
        if: '!cancelled()'
        run: pnpm -r test

      - name: Build (bundles main/preload/renderer)
        if: '!cancelled()'
        run: pnpm -r build

  e2e:
    name: e2e (Electron smoke — app launch + doctor round-trip)
    # A separate job because it needs the real Electron binary (the `verify` job
    # skips the download) and, on Linux, a virtual display. First display-enabled job
    # in CI (TD-07); pays down the "app-launch unverified in CI" gap.
    #
    # Runs on both Linux and macOS (TD-04). macOS is our first-class target (NG-7), so
    # a real Electron launch there — plus the reaper E2E exercising macOS `ps -o lstart=`
    # and `kill(-pgid)` end-to-end — is the platform coverage ubuntu can't give. macOS
    # runners bill ~10× Linux, so only this platform-sensitive suite runs there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (with Electron binary)
        # NOTE: unlike `verify`, do NOT set ELECTRON_SKIP_BINARY_DOWNLOAD — the E2E
        # tests launch the real binary. `electron` is in `onlyBuiltDependencies`, so
        # its postinstall fetches the platform binary here.
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary is present
        # The pnpm store cache is shared with the `verify` job, which installs with
        # ELECTRON_SKIP_BINARY_DOWNLOAD=1. If that job seeds the cache first, pnpm
        # restores electron marked "built" but with no binary, and skips the
        # postinstall here — electron.launch then fails "failed to install
        # correctly". Force-run electron's own installer so the binary is always
        # fetched, independent of cache ordering.
        run: >-
          pnpm --filter @icarus/desktop exec node -e
          "require('node:child_process').execFileSync(process.execPath,
          [require.resolve('electron/install.js')], { stdio: 'inherit' })"

      - name: Install Electron/Chromium system libs + xvfb (Linux only)
        # Playwright's dep installer pulls the shared libraries Electron's Chromium
        # needs (libnss3, libgbm, libatk, …) plus xvfb — maintained across Ubuntu
        # versions, so we don't hand-maintain an apt list. macOS ships these + a real
        # display, so this step (and xvfb) are Linux-only.
        if: runner.os == 'Linux'
        run: pnpm --filter @icarus/desktop exec playwright install-deps

      - name: Build (bundles main/preload/renderer)
        run: pnpm -r build

      - name: E2E (Linux, under xvfb)
        # xvfb-run gives the headless Linux runner a virtual X display for the window.
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @icarus/desktop test:e2e

      - name: E2E (macOS)
        # macOS runners have a display; launch Electron directly, no xvfb.
        if: runner.os == 'macOS'
        run: pnpm --filter @icarus/desktop test:e2e
