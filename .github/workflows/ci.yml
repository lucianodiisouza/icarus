name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to keep the pipeline fast (G-8).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck · lint · format · test · build)
    # ubuntu is fast/cheap and enough while there is no iOS/native tooling yet.
    # macOS runners are added when device tooling (simctl/adb) lands (NG-7 / Doc 15).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        # CI bundles but never launches Electron, so skip the ~100MB binary download.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # Independent checks — run them all even if an earlier one fails, so a PR shows
      # every problem at once.
      - name: Typecheck
        if: '!cancelled()'
        run: pnpm -r typecheck

      - name: Lint (incl. no-electron-in-core boundary rule)
        if: '!cancelled()'
        run: pnpm lint

      - name: Format check
        if: '!cancelled()'
        run: pnpm format:check

      - name: Test
        if: '!cancelled()'
        run: pnpm -r test

      - name: Build (bundles main/preload/renderer)
        if: '!cancelled()'
        run: pnpm -r build

  e2e:
    name: e2e (Electron smoke — app launch + doctor round-trip)
    # A separate job because it needs the real Electron binary (the `verify` job
    # skips the download) and a virtual display. First display-enabled job in CI
    # (TD-07); pays down the "app-launch unverified in CI" gap.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (with Electron binary)
        # NOTE: unlike `verify`, do NOT set ELECTRON_SKIP_BINARY_DOWNLOAD — the E2E
        # tests launch the real binary. `electron` is in `onlyBuiltDependencies`, so
        # its postinstall fetches the platform binary here.
        run: pnpm install --frozen-lockfile

      - name: Install Electron/Chromium system libs + xvfb
        # Playwright's dep installer pulls the shared libraries Electron's Chromium
        # needs (libnss3, libgbm, libatk, …) plus xvfb — maintained across Ubuntu
        # versions, so we don't hand-maintain an apt list.
        run: pnpm --filter @icarus/desktop exec playwright install-deps

      - name: Build (bundles main/preload/renderer)
        run: pnpm -r build

      - name: E2E (Electron under xvfb)
        # xvfb-run gives the headless runner a virtual X display for the window.
        run: xvfb-run -a pnpm --filter @icarus/desktop test:e2e
