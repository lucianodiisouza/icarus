# Auto-update is wired but **not** auto-publishing. Doc 16 — "surface, not
# force." A real auto-update feed ships in a follow-on (gated on first
# design-partner validation, OQ-2). For v1, GitHub Releases is the
# distribution surface; users download manually.
# publish:
#   provider: github
#   releaseType: release
